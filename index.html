<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Luta Presidencial</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, sans-serif; }
  canvas { position: absolute; display: block; left: 0; top: 0; image-rendering: auto; background: #000; }
  #mute { position: fixed; bottom: 6px; right: 6px; z-index: 5; background: rgba(0,0,0,.6); color: #fff;
    border: 1px solid #fff6; border-radius: 6px; font: 600 11px system-ui, sans-serif; padding: 5px 8px; cursor: pointer; }
  body.touch #mute { bottom: auto; right: auto; font-size: 12px; padding: 7px 10px; }
  #touch { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 4; --cell: 60px; }
  body.touch #touch { display: block; }
  #dpad { position: absolute; border-radius: 50%; pointer-events: auto; touch-action: none;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.07) 0 34%, rgba(255,255,255,.14) 35% 100%);
    border: 2px solid rgba(255,255,255,.3); box-sizing: border-box; }
  #dpad i { position: absolute; color: rgba(255,255,255,.55); font: 700 calc(var(--cell) * .3)/1 system-ui, sans-serif; font-style: normal; }
  #dpad i.u { left: 50%; top: 7%; transform: translateX(-50%); } #dpad i.d { left: 50%; bottom: 7%; transform: translateX(-50%); }
  #dpad i.l { left: 7%; top: 50%; transform: translateY(-50%); } #dpad i.r { right: 7%; top: 50%; transform: translateY(-50%); }
  #dpad .knob { position: absolute; left: 50%; top: 50%; width: 36%; height: 36%; margin: -18% 0 0 -18%;
    border-radius: 50%; background: rgba(255,255,255,.38); border: 2px solid rgba(255,255,255,.55); pointer-events: none; box-sizing: border-box; }
  #btns { position: absolute; display: grid; gap: 6px; pointer-events: none; }
  .btn { pointer-events: auto; touch-action: none; width: var(--cell); height: var(--cell); border-radius: 50%; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; text-align: center; color: #fff; font: 800 calc(var(--cell) * .2)/1.05 system-ui, sans-serif;
    background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.4); }
  .btn.on { background: rgba(255,210,58,.6); border-color: #ffd23a; }
  .btn[data-k="sp"] { background: rgba(232,32,46,.4); border-color: rgba(255,120,120,.7); }
  .btn[data-k="L"] { background: rgba(255,210,58,.4); border-color: #ffd23a; font-size: calc(var(--cell) * .5); }
  .btn[data-k="su"] { background: rgba(255,210,58,.5); border-color: #ffd23a; opacity: .3; }
  .btn[data-k="su"].ready { opacity: 1; box-shadow: 0 0 14px #ffd23a; }
  .btn[data-k="start"] { border-radius: calc(var(--cell) * .3); font-size: calc(var(--cell) * .17); }
  #rotate { display: none; position: fixed; inset: 0; z-index: 9; background: #000; color: #fff; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; font: 800 20px system-ui, sans-serif; padding: 24px; gap: 14px; }
  #rotate b { font-size: 64px; display: inline-block; animation: giro 2.4s ease-in-out infinite; }
  @keyframes giro { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { body.touch #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game" width="768" height="432"></canvas>
<button id="mute" type="button">SOM: ON</button>
<div id="touch">
  <div id="dpad"><i class="u">▲</i><i class="d">▼</i><i class="l">◀</i><i class="r">▶</i><div class="knob"></div></div>
  <div id="btns">
    <div class="btn" data-k="lp">SOCO</div>
    <div class="btn" data-k="hp">SOCO<br>FORTE</div>
    <div class="btn" data-k="lk">CHUTE</div>
    <div class="btn" data-k="hk">CHUTE<br>FORTE</div>
    <div class="btn" data-k="sp">ESPE-<br>CIAL</div>
    <div class="btn" data-k="L">L</div>
    <div class="btn" data-k="su" id="superBtn">SUPER</div>
    <div class="btn" data-k="start">PAUSA</div>
  </div>
</div>
<div id="rotate"><b>📱</b><div>Gire o celular para jogar deitado</div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
